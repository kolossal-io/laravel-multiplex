name: Release

on:
  push:
    branches:
      - main
      - "[0-9]+.x"

jobs:
  tests:
    name: Run Tests
    uses: ./.github/workflows/snippet-tests.yml

  release:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: "Release semantic-version"
        run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/changelog@6
          -p @semantic-release/git@10
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
